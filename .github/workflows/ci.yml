name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: node tests/package-smoke.mjs
      - run: mkdir -p artifacts
      - run: pnpm --filter @humanuml/core pack --pack-destination artifacts
      - run: pnpm --filter @humanuml/cli pack --pack-destination artifacts
      - run: pnpm --filter @humanuml/uml-core pack --pack-destination artifacts
